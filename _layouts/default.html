<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="links">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a class="link-gh" href="https://github.com/jongjunn" target="_blank" rel="noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="foot">
    <div class="foot-inner">
      <span class="foot-brand">{{ site.title }}</span>
      <span class="foot-desc">결제 정합성 · 동시성 · 운영 품질 · 설명 가능한 AI 기능</span>
      <span class="foot-copy">© 2026 박종준</span>
    </div>
  </footer>
</body>
</html>
